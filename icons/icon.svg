<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </radialGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D084"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="batWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Stadium Pitch Turf Arc -->
  <path d="M 80 340 C 140 430, 372 430, 432 340 C 360 400, 152 400, 80 340 Z" fill="url(#pitchGrad)"/>
  
  <!-- Crease lines -->
  <path d="M 170 380 L 342 380" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Speed streaks -->
  <path d="M 280 200 L 400 120" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 310 230 L 420 150" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 320 260 L 430 190" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <circle cx="390" cy="130" r="4" fill="#FCD34D"/>
  <circle cx="410" cy="170" r="3" fill="#FCD34D"/>
  <circle cx="430" cy="220" r="4" fill="#FCD34D"/>

  <!-- Cricket Bat (Angled) -->
  <g transform="translate(80, 100) rotate(-42)">
    <!-- Handle Grip -->
    <rect x="18" y="-30" width="16" height="70" rx="6" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
    <path d="M 18 -15 L 34 -15 M 18 0 L 34 0 M 18 15 L 34 15" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <!-- Bat Shoulder & Blade -->
    <path d="M 10 40 C 14 36, 38 36, 42 40 L 46 220 C 46 235, 6 235, 6 220 Z" fill="url(#batWood)" stroke="#F59E0B" stroke-width="3"/>
    <!-- Blade Ridge -->
    <path d="M 26 40 L 26 225" stroke="#FDE68A" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Cricket Ball -->
  <g transform="translate(290, 220)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="58" fill="#F59E0B" opacity="0.25" filter="url(#glow)"/>
    <!-- Ball body -->
    <circle cx="0" cy="0" r="54" fill="url(#ballGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Seam -->
    <path d="M -38 -38 C 5 -10, 10 5, 38 38" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
    <path d="M -38 -38 C 5 -10, 10 5, 38 38" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M -44 -32 C 0 -6, 6 0, 32 44" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  </g>
</svg>
